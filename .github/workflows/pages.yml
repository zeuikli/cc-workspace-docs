name: VitePress Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # docs/research/ 是 cc-workspace/research/ 的鏡像，sync 進來的內容可能帶有
      # VitePress 無法解析的 HTML tag（會直接 build 失敗）或指向未同步檔案的 404 連結。
      # 這兩項修正是冪等的機械規則，在 build 前重跑一次，避免 sync 破壞部署。
      - name: Normalize synced markdown
        run: |
          python3 scripts/md_maintenance.py --html-only
          python3 scripts/md_maintenance.py --links-only

      - name: Build with VitePress
        run: npm run docs:build

      - name: Check links
        run: python3 scripts/check_links.py

      - name: Deploy to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd docs/.vitepress/dist
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: deploy [skip ci]"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
